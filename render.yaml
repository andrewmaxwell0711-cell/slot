# Fortune Reels — Render Blueprint (Python web service, Stripe TEST mode only).
# After the first deploy, set PUBLIC_BASE_URL to the public https://…onrender.com
# origin (or your custom domain) so Stripe Checkout success/cancel URLs work.
services:
  - type: web
    name: fortune-reels
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crystal-casino-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
databases:
  # Free Render Postgres expires (and may be paused) after a limited period.
  # Recreate or upgrade the database if the instance is deleted at expiry.
  - name: crystal-casino-db
    plan: free
    region: oregon
    databaseName: crystal_casino
    user: casino
    postgresMajorVersion: "16"
